<title>Studio</title>

<style>
  :root {
    --bg: #ECE7DC; --fg: #221E1A; --muted: #6E655A; --rule: #CFC6B5;
    --frame: #F7F4EC; --frame-edge: #D9D2C2; --accent: #B8321F; --accent-ink: #FFF7F2;
    --shadow: 0 30px 60px -30px rgba(40, 28, 16, .45), 0 2px 0 rgba(255,255,255,.6) inset;
    --display: "Young Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --body: "Karla", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1E1B18; --fg: #EDE6D8; --muted: #A89D8D; --rule: #3B342D;
      --frame: #2A2521; --frame-edge: #3D362F; --accent: #E25A43; --accent-ink: #1E1B18;
      --shadow: 0 40px 70px -30px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.06) inset;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1E1B18; --fg: #EDE6D8; --muted: #A89D8D; --rule: #3B342D;
    --frame: #2A2521; --frame-edge: #3D362F; --accent: #E25A43; --accent-ink: #1E1B18;
    --shadow: 0 40px 70px -30px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.06) inset;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--body); font-size: 17px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    display: grid; place-items: center;
    padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
    box-sizing: border-box;
  }
  .card {
    width: min(100%, 420px);
    background: var(--frame);
    border: 1px solid var(--frame-edge);
    box-shadow: var(--shadow);
    padding: 36px 32px 30px;
    box-sizing: border-box;
  }
  .eyebrow {
    font-family: var(--mono); font-size: 12.5px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted); margin: 0 0 14px;
  }
  h1 {
    font-family: var(--display); font-weight: 400;
    font-size: clamp(34px, 6vw, 44px); line-height: 1; letter-spacing: -.01em; margin: 0 0 22px;
  }
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  input[type="password"] {
    width: 100%; box-sizing: border-box;
    font: 400 17px/1.3 var(--mono);
    color: var(--fg); background: var(--bg);
    border: 1px solid var(--rule); border-radius: 6px;
    padding: 12px 14px;
  }
  input[type="password"]:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 18px; flex-wrap: wrap; }
  .remember { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .remember input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  button {
    appearance: none; border: 0; cursor: pointer;
    font: 500 15px/1 var(--body); color: var(--accent-ink); background: var(--accent);
    padding: 14px 22px; border-radius: 999px;
    box-shadow: 0 10px 24px -14px var(--accent);
    transition: transform .15s ease, opacity .15s ease;
  }
  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: .55; cursor: progress; transform: none; }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .msg { min-height: 1.4em; margin: 16px 0 0; font-size: 14px; color: var(--muted); }
  .msg.err { color: var(--accent); }
  .foot { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--rule); font-family: var(--mono); font-size: 12px; letter-spacing: .04em; color: var(--muted); }
  .foot a { color: inherit; }
</style>
</head>
<body>
<main class="card">
  <p class="eyebrow">Noah Alexander</p>
  <h1>Studio</h1>
  <form id="f" autocomplete="off">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus required>
    <div class="row">
      <label class="remember"><input id="keep" type="checkbox"> Stay unlocked on this device</label>
      <button id="go" type="submit">Open</button>
    </div>
    <p id="msg" class="msg" aria-live="polite"></p>
  </form>
  <p class="foot"><a href="/">noahalexanderart.com</a></p>
</main>

<script>
(function () {
  var P = JSON.parse(document.getElementById('payload').textContent);
  var enc = new TextEncoder(), dec = new TextDecoder();
  var form = document.getElementById('f'), pw = document.getElementById('pw'),
      keep = document.getElementById('keep'), go = document.getElementById('go'),
      msg = document.getElementById('msg');
  var STORE = 'studio-key:' + P.salt;   // salt changes when the page is re-locked, so stale keys are ignored

  function b64(s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function say(t, err) { msg.textContent = t; msg.className = 'msg' + (err ? ' err' : ''); }

  async function deriveKey(password) {
    var km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(P.salt), iterations: P.iterations, hash: 'SHA-256' },
      km, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function open(key) {
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct));
    var html = dec.decode(pt);
    document.open(); document.write(html); document.close();
  }

  // Try a remembered key first: this tab's session, then this device.
  (async function () {
    var jwk = null, from = null;
    try { jwk = sessionStorage.getItem(STORE); from = 'session'; } catch (_) {}
    if (!jwk) { try { jwk = localStorage.getItem(STORE); from = 'local'; } catch (_) {} }
    if (!jwk) return;
    try {
      say('Unlocking…');
      var key = await crypto.subtle.importKey('jwk', JSON.parse(jwk), { name: 'AES-GCM' }, true, ['decrypt']);
      await open(key);
    } catch (e) {
      try { sessionStorage.removeItem(STORE); localStorage.removeItem(STORE); } catch (_) {}
      say('The page was re-locked. Please enter the password again.');
    }
  })();

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!window.isSecureContext || !crypto.subtle) { say('This page needs HTTPS to unlock.', true); return; }
    go.disabled = true; say('Unlocking…');
    try {
      var key = await deriveKey(pw.value);
      var jwk = JSON.stringify(await crypto.subtle.exportKey('jwk', key));
      try { sessionStorage.setItem(STORE, jwk); } catch (_) {}            // carries across locked pages in this tab
      if (keep.checked) { try { localStorage.setItem(STORE, jwk); } catch (_) {} } // and across visits on this device
      await open(key);
    } catch (err) {
      say('That password did not open it.', true);
      pw.select();
    } finally { go.disabled = false; }
  });
})();
</script>
