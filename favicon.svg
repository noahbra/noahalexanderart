<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Noah Alexander Art: a single cadmium-red dab on a linen ground. Follows the system color scheme. -->
  <style>
    .ground { fill: #ECE7DC; }
    .dab { fill: #B8321F; }
    .light { fill: #FFFFFF; fill-opacity: .18; }
