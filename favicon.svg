  <path class="light" d="M26.2 22.1c3.1-2.6 7.7-3.2 11.5-1.6-4.4.1-8.5 2.2-11.1 5.6-1.3 1.7-2.1 3.7-2.3 5.8-1.3-3.4-.4-7.4 1.9-9.8z"/>
